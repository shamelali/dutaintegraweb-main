            <h2>~65% enquiries handled. 24/7 first response. 0 made-up answers.</h2>
            <p class="sub">An AI assistant built to answer customer questions from the business's own documentation, integrated into the existing website and messaging channels to reduce repeated support work.</p>

            <div class="metrics" style="margin: 24px 0;">
              <div><b>~65%</b><span>Enquiries handled</span></div>
              <div><b>24/7</b><span>First response</span></div>
              <div><b>0</b><span>Made-up answers</span></div>
            </div>

            <h3>The challenge</h3>
            <p>The internal team at Duta Integra was spending significant time answering repetitive pre-sales and support questions — pricing, feature scope, onboarding process, PDPA compliance details. Documentation existed but customers didn't read it. A 24/7 human response wasn't viable for a small team.</p>

            <h3>What we built</h3>
            <ul>
              <li><b>Retrieval-Augmented Generation (RAG)</b> — indexed all public docs, proposals, FAQs, and policy PDFs into a vector store; the assistant only answers from grounded context.</li>
              <li><b>Zero hallucination guardrails</b> — if confidence is low or no relevant context found, the assistant says "I don't know" and offers human handoff.</li>
              <li><b>Multi-channel deployment</b> — embedded on website (widget), WhatsApp Business API, and Slack (internal).</li>
              <li><b>Human handoff workflow</b> — when the assistant escalates, it creates a ticket with full conversation context; the team responds in Slack and the reply flows back to the user.</li>
              <li><b>Analytics dashboard</b> — tracks resolution rate, fallback rate, top unanswered questions, and user satisfaction.</li>
              <li><b>PDPA-compliant</b> — no PII stored in vector DB; conversation logs retained per retention policy; user consent for data processing.</li>
            </ul>

            <h3>Outcomes</h3>
            <ul>
              <li>Retrieval-based assistant grounded in company knowledge</li>
              <li>Embedded into the existing site, no rip-and-replace</li>
              <li>Handover to a human when the question needs one</li>
              <li>~65% of incoming enquiries fully resolved without human intervention</li>
              <li>24/7 first response capability for a team that sleeps</li>
              <li>Zero hallucinated answers — every response traceable to source docs</li>
            </ul>
