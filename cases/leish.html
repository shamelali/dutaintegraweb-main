            <h2>~80%+ mobile traffic. <90s to book. 1 extendable codebase.</h2>
            <p class="sub">A booking marketplace for a beauty services brand — a custom web application handling discovery, scheduling, and customer flow rather than a generic off-the-shelf theme.</p>

            <div class="metrics" style="margin: 24px 0;">
              <div><b>~80%+</b><span>Mobile traffic</span></div>
              <div><b><90s</b><span>To book</span></div>
              <div><b>1</b><span>Extendable codebase</span></div>
            </div>

            <h3>The challenge</h3>
            <p>Leish, a beauty services brand, needed a marketplace connecting customers with beauty professionals. Off-the-shelf booking plugins couldn't handle their multi-vendor model, complex service variations, and the need for a branded mobile-first experience. They also needed the platform to extend into payments and notifications later.</p>

            <h3>What we built</h3>
            <ul>
              <li><b>Custom booking flow</b> — service discovery → provider selection → time slot → confirmation, tailored to beauty service categories (hair, nails, spa, makeup).</li>
              <li><b>Provider dashboard</b> — professionals manage availability, services, pricing, and view bookings in real time.</li>
              <li><b>Customer portal</b> — booking history, favorites, rebook in one tap, and loyalty points tracking.</li>
              <li><b>Mobile-first PWA</b> — installable, offline-capable, push notifications for reminders and promotions.</li>
              <li><b>Extensible architecture</b> — modular monolith with clear service boundaries; ready for payment gateway (Stripe/FPW), WhatsApp notifications, and reviews module.</li>
              <li><b>Admin backoffice</b> — platform ops manage providers, disputes, payouts, and platform-wide analytics.</li>
            </ul>

            <h3>Outcomes</h3>
            <ul>
              <li>Custom booking flow tailored to the service model</li>
              <li>Mobile-first storefront for on-the-go bookings</li>
              <li>Built to extend into payments and notifications</li>
              <li>~80%+ of traffic from mobile — PWA install rate exceeds industry average</li>
              <li>Booking completion in under 90 seconds median</li>
              <li>Single codebase — no plugin conflicts, no vendor lock-in</li>
            </ul>
