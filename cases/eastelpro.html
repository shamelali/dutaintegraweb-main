            <h2>~65% visitor opt-in. Minute-level follow-up. 99.5% uptime.</h2>
            <p class="sub">Set up a WiFi marketing portal for customer capture, alongside managed network and helpdesk support. Lead capture now flows directly into the sales pipeline instead of a notebook.</p>

            <div class="metrics" style="margin: 24px 0;">
              <div><b>~65%</b><span>Visitor opt-in</span></div>
              <div><b>Min</b><span>Follow-up time</span></div>
              <div><b>99.5%</b><span>Uptime target</span></div>
            </div>

            <h3>The challenge</h3>
            <p>Eastelpro provides telecommunications infrastructure to commercial properties. They had high foot traffic at their sites but no systematic way to capture visitor details. Leads were written in notebooks, follow-up was inconsistent, and network issues were only discovered when customers complained.</p>

            <h3>What we did</h3>
            <ul>
              <li><b>Branded WiFi captive portal</b> — custom-designed splash page with company branding, terms acceptance, and social/email login options.</li>
              <li><b>Lead capture & enrichment</b> — visitor details (name, email, phone, company) collected at first connection; enriched with location and dwell time.</li>
              <li><b>CRM integration</b> — leads routed automatically into sales pipeline with source tagging; instant Slack/email notification to sales team.</li>
              <li><b>Network monitoring & helpdesk</b> — 24/7 monitoring of all site infrastructure (APs, switches, uplinks); remote helpdesk for tenant issues.</li>
              <li><b>Automated follow-up sequences</b> — multi-touch email/WhatsApp nurture flows triggered by visit behavior.</li>
              <li><b>Monthly performance reporting</b> — opt-in rates, dwell time, lead-to-opportunity conversion, and network health summary.</li>
            </ul>

            <h3>Outcomes</h3>
            <ul>
              <li>Branded WiFi captive portal for visitor lead capture</li>
              <li>Network monitoring and remote helpdesk rolled in</li>
              <li>Leads routed straight into CRM follow-up</li>
              <li>~65% of unique visitors opt in to marketing communications</li>
              <li>Sales team receives leads within minutes, not days</li>
            </ul>
