name: CI — Lint, Test, Build & Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint --if-present || npx eslint api js --ext .js || echo "no eslint config — skipping"

      - name: Type check (if TS)
        run: npm run typecheck --if-present || echo "no typecheck"

      - name: Unit tests
        run: npm test --if-present || echo "no tests yet"

      - name: Validate vercel.json
        run: python3 -m json.tool vercel.json > /dev/null && echo "vercel.json OK"

      - name: Validate HTML
        run: |
          for f in *.html ms/*.html cases/*.html admin/*.html; do
            [ -f "$f" ] || continue
            grep -q "<!DOCTYPE html>" "$f" || (echo "Missing DOCTYPE $f" && exit 1)
          done
          echo "HTML OK"

      - name: Check no secrets committed
        run: |
          ! grep -R "re_[A-Za-z0-9]\{20,\}" --include="*.js" --include="*.html" . 2>/dev/null || (echo "Possible Resend key in repo" && exit 1)
          ! grep -R "sb_secret" --include="*.js" . 2>/dev/null || (echo "Possible Supabase secret in repo" && exit 1)
          echo "secret scan OK"

      - name: Audit deps
        run: npm audit --audit-level=moderate || true

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.2' }
      - run: npm ci
      - name: Build preview (static check)
        run: |
          echo "Static site — no build step. Verifying rewrites..."
          cat vercel.json | python3 -c "import json,sys; d=json.load(open('vercel.json')); assert 'rewrites' in d; print('rewrites OK')"

  health-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Wait for Vercel deploy
        run: sleep 30
      - name: Hit /api/health
        run: |
          curl -fsS https://dutaintegra.my/api/health | jq . 2>/dev/null || curl -fsS https://dutaintegra.my/api/health || echo "health check skipped (no prod yet)"
