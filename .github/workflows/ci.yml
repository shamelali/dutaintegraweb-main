name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: npm test

  # web-new is where the frontend actually lives. Without this job its TypeScript
  # errors go unnoticed, which is how 70 of them accumulated.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-new/package-lock.json

      - name: Install dependencies
        working-directory: web-new
        run: npm ci

      - name: Unit tests
        working-directory: web-new
        run: npm test

      - name: Lint
        working-directory: web-new
        run: npm run lint

      - name: Typecheck and build
        working-directory: web-new
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-new-dist
          path: web-new/dist
          retention-days: 7

  # Warnings never fail the build; only a credential the provider confirms as
  # live does. The gate is deliberately narrow so a red X here always means a
  # real, working secret is exposed — not a docs example or a test fixture.
  #
  # History is scanned too: a secret that was committed and later deleted is
  # still recoverable by anyone with a clone. fetch-depth: 0 is required for it.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan working tree
        run: node scripts/scan-secrets.mjs --verify

      - name: Scan git history
        run: node scripts/scan-secrets.mjs --history --verify

  # Guards against the failure mode this repo already hit: a bundle committed to
  # Web/ that no longer matches web-new/ source. Rebuild and diff.
  artifact-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-new/package-lock.json

      - name: Rebuild deploy artifact
        run: npm run build:web

      - name: Fail if Web/ is stale
        run: |
          # Porcelain (not `git diff`) so newly emitted hashed bundles count too.
          if [ -n "$(git status --porcelain -- Web/)" ]; then
            echo "::error::Web/ is out of date with web-new/ source."
            echo "Run 'npm run build:web' and commit the result."
            git status --porcelain -- Web/
            exit 1
          fi
          echo "Web/ matches a fresh build of web-new/."
