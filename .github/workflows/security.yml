name: Security & Quality Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check for sensitive files
        run: |
          echo "Checking for exposed sensitive files..."
          ! git ls-files | grep -E "\.pptx$|\.pdf$|\.env$|build-pdf.py|serve.py" || (echo "Sensitive files found in repo!" && exit 1)
          echo "No sensitive files found"

      - name: Validate vercel.json
        run: |
          cat vercel.json | python3 -m json.tool > /dev/null && echo "vercel.json valid"

      - name: Validate HTML files
        run: |
          echo "Checking HTML files for basic validity..."
          for f in *.html ms/*.html cases/*.html admin/*.html; do
            if [ -f "$f" ]; then
              # Check for basic structure
              grep -q "<!DOCTYPE html>" "$f" || (echo "Missing DOCTYPE in $f" && exit 1)
              grep -q "</html>" "$f" || (echo "Missing closing html tag in $f" && exit 1)
            fi
          done
          echo "HTML files valid"

      - name: Check CSP headers in vercel.json
        run: |
          echo "Checking CSP configuration..."
          grep -q "Content-Security-Policy" vercel.json && echo "CSP header configured" || (echo "Missing CSP header" && exit 1)

      - name: Verify API routes exist
        run: |
          echo "Checking API routes..."
          for f in api/send-email.js api/public.js api/_lib.js api/admin.js api/cron.js; do
            [ -f "$f" ] || (echo "Missing $f" && exit 1)
          done
          echo "API routes present"

      - name: Check robots.txt and sitemap.xml
        run: |
          [ -f robots.txt ] || (echo "Missing robots.txt" && exit 1)
          [ -f sitemap.xml ] || (echo "Missing sitemap.xml" && exit 1)
          echo "SEO files present"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run HTMLHint linter
        uses: socialGov/HTMLHint-action@v1
        with:
          files: '*.html'

      - name: Run custom lint checks
        run: |
          echo "Running custom lint checks..."
          # Check for console.log in production JS
          ! grep -r "console\.log" js/main.js js/admin.js 2>/dev/null || echo "Warning: console.log found in production JS"
          # Check for hardcoded localhost URLs in client JS
          ! grep -r "localhost" js/ 2>/dev/null || echo "Warning: localhost reference found"
          echo "Lint checks complete"