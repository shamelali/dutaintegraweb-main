name = "dutaintegra"
# 2024-09-23 is the minimum date at which nodejs_compat exposes a populated
# global `process.env` (populated from the Pages environment bindings).
# supabase-client.mjs reads process.env at module top level and depends on this.
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

compatibility_flags = ["nodejs_compat"]

# Environment variables (set in Cloudflare Pages dashboard)
# SUPABASE_URL = ""
# SUPABASE_SERVICE_ROLE_KEY = ""
# ADMIN_TOKEN = ""
# DIGEST_TOKEN = ""
# ALLOWED_ORIGINS = "https://dutaintegra.my,https://www.dutaintegra.my"
# CONTACT_INBOX_EMAIL = ""
# EMAIL_FROM = "Duta Integra <no-reply@dutaintegrasolutions.com>"
# RESEND_API_KEY = "" (or BREVO_API_KEY / POSTMARK_SERVER_TOKEN)
# BREVO_API_KEY = ""
# POSTMARK_SERVER_TOKEN = ""

[vars]
NODE_ENV = "production"

# Custom domain: dutaintegra.my (configure in Cloudflare Pages dashboard)