<!-- SECURED CONTACT FORM - Replace your current <form> in contact.html -->
<form id="contactForm" method="POST">
  <!-- Honeypot - hide with CSS -->
  <input type="text" name="website" id="website" autocomplete="off" tabindex="-1" style="position:absolute; left:-9999px; opacity:0; height:0; width:0;">
  
  <input type="text" name="name" required minlength="2" maxlength="100" placeholder="Your Name *">
  <input type="email" name="email" required placeholder="Email *">
  <input type="text" name="company" maxlength="200" placeholder="Company">
  <textarea name="message" required minlength="10" maxlength="5000" placeholder="How can we help? *"></textarea>
  
  <button type="submit" id="submitBtn">Send Message</button>
  <p id="formStatus" aria-live="polite"></p>
</form>

<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('formStatus');
  btn.disabled = true; btn.textContent = 'Sending...';
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);
  
  try {
    const res = await fetch('/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed');
    status.textContent = 'Message sent! We will reply within 24h.';
    e.target.reset();
  } catch(err) {
    status.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Send Message';
  }
});
</script>
