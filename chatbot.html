<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Duta Integra Solutions</title>
    <style>
        :root {
            --navy: #0B1D3A;
            --blue: #1565C0;
            --electric: #00B4FF;
            --white: #F8FAFF;
            --gray: #8A9BB5;
            --dark: #060F1F;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--white);
            color: var(--navy);
        }

        /* Chat floating button */
        #chat-float-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            background: var(--electric);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 180, 255, 0.3);
            z-index: 1000;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #chat-float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 180, 255, 0.4);
        }

        #chat-float-btn:focus {
            outline: none;
        }

        #chat-float-btn::after {
            content: '\1F5E6';
            font-size: 24px;
            color: var(--dark);
            display: block;
            width: 100%;
            height: 100%;
            line-height: 60px;
            text-align: center;
        }

        /* Chat container */
        #chat-container {
            position: fixed;
            bottom: 8rem;
            right: 2rem;
            width: 350px;
            max-height: 70vh;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #chat-container.open {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        #chat-header {
            background: var(--navy);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }

        #chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        #chat-close:hover {
            color: var(--electric);
        }

        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 12px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.4;
        }

        .user-message {
            text-align: right;
            background: #e3f2fd;
            color: #1a237e;
            margin-left: auto;
        }

        .assistant-message {
            background: #f1f8e9;
            color: #2e7d32;
        }

        .typing-indicator {
            padding: 8px 12px;
            color: #666;
            font-style: italic;
            max-width: 85%;
            margin-left: auto;
        }

        #chat-input {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }

        #chat-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px 0 0 20px;
            outline: none;
            font-size: 13px;
        }

        #chat-input button {
            padding: 0 16px;
            background: var(--electric);
            color: var(--dark);
            border: none;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        #chat-input button:hover {
            background: #0091d8;
        }

        /* Hidden state when closed */
        #chat-container.closed {
            transform: translateY(100px);
        }
    </style>
</head>

<body>
    <!-- Floating chat button -->
    <button id="chat-float-btn" aria-label="Open AI chat" onclick="toggleChat()" role="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin: auto;">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </button>

    <!-- Chat container -->
    <div id="chat-container" aria-live="polite">
        <div id="chat-header">
            <h2>AI Assistant</h2>
            <button id="chat-close" onclick="toggleChat()" aria-label="Close chat">✕</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input type="text" id="input-message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messages = [];
        const messagesDiv = document.getElementById("chat-messages");
        const chatContainer = document.getElementById("chat-container");
        const floatBtn = document.getElementById("chat-float-btn");

        // Toggle chat visibility
        function toggleChat() {
            if (chatContainer.classList.contains('open')) {
                closeChat();
            } else {
                openChat();
            }
        }

        function openChat() {
            chatContainer.classList.add('open');
            // Focus the input after a slight delay
            setTimeout(() => {
                const input = document.getElementById("input-message");
                if (input) input.focus();
            }, 300);
        }

        function closeChat() {
            chatContainer.classList.remove('open');
            chatContainer.classList.add('closed');
            // Reset after animation
            setTimeout(() => {
                chatContainer.classList.remove('closed');
            }, 300);
        }

        function addMessage(content, isUser, isTyping = false) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");

            if (isUser) {
                messageDiv.classList.add("user-message");
            } else if (isTyping) {
                messageDiv.classList.add("typing-indicator");
                messageDiv.textContent = "AI is typing...";
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                return;
            } else {
                messageDiv.classList.add("assistant-message");
            }

            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearTyping() {
            const typing = messagesDiv.querySelector(".typing-indicator");
            if (typing) {
                typing.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById("input-message");
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage(message, true);
            input.value = '';
            messages.push({ content: message, role: 'user' });

            // Show typing indicator
            addMessage('', false, true);

            try {
                const response = await puter.ai.chat(messages);
                clearTyping();

                if (response && response.message) {
                    addMessage(response.message, false);
                    messages.push(response.message);
                } else if (response && response.content) {
                    addMessage(response.content, false);
                    messages.push({ content: response.content, role: 'assistant' });
                } else {
                    addMessage("I received a response but no message content was found.", false);
                }
            } catch (error) {
                clearTyping();
                console.error("AI response error:", error);
                addMessage("Sorry, I encountered an error. Please try again.", false);
            }
        }

        // Allow pressing Enter to send
        document.getElementById("input-message").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>

</html>
