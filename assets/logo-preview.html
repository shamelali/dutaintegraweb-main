<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Integra Solutions - Logo Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; padding: 3rem; background: #f5f5f5; }
    .section { margin-bottom: 3rem; }
    .section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; color: #333; }
    .logo-container { padding: 2rem; border-radius: 12px; display: inline-block; margin-right: 1.5rem; margin-bottom: 1.5rem; }
    .dark-bg { background: #0B1D3A; }
    .light-bg { background: #FFFFFF; border: 1px solid #e0e0e0; }
    .gradient-bg { background: linear-gradient(135deg, #0B1D3A 0%, #1565C0 100%); }
    img.logo { height: 60px; }
    img.icon { height: 80px; }
    .note { color: #666; font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1 style="margin-bottom: 2rem; font-size: 1.8rem;">Duta Integra Solutions — Logo Variants</h1>

  <div class="section">
    <h2>Full Logo (Dark Background)</h2>
    <div class="logo-container dark-bg">
      <img src="logo-white.svg" alt="Duta Integra Logo - White" class="logo">
    </div>
    <p class="note">Use on dark backgrounds (navy, dark blue, etc.)</p>
  </div>

  <div class="section">
    <h2>Full Logo (Light Background)</h2>
    <div class="logo-container light-bg">
      <img src="logo-dark.svg" alt="Duta Integra Logo - Dark" class="logo">
    </div>
    <p class="note">Use on light/white backgrounds</p>
  </div>

  <div class="section">
    <h2>Icon Only</h2>
    <div class="logo-container dark-bg">
      <img src="logo-icon.svg" alt="Duta Integra Icon" class="icon">
    </div>
    <div class="logo-container light-bg">
      <img src="logo-icon.svg" alt="Duta Integra Icon" class="icon">
    </div>
    <p class="note">Use for social media profiles, app icons, compact spaces</p>
  </div>

  <div class="section">
    <h2>Favicon</h2>
    <div class="logo-container light-bg" style="padding: 1rem;">
      <img src="favicon.svg" alt="Duta Integra Favicon" style="height: 32px;">
    </div>
    <p class="note">Use as browser tab icon</p>
  </div>
</body>
</html>
