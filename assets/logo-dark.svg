<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Connected nodes representing AI/IT integration -->
  <g transform="translate(5, 8)">
    <!-- Hexagon base -->
    <polygon points="22,0 44,12 44,36 22,48 0,36 0,12" fill="none" stroke="#00B4FF" stroke-width="2.5"/>
    <!-- Inner connection lines -->
    <line x1="22" y1="0" x2="22" y2="48" stroke="#00B4FF" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="12" x2="44" y2="36" stroke="#00B4FF" stroke-width="1.5" opacity="0.5"/>
    <line x1="44" y1="12" x2="0" y2="36" stroke="#00B4FF" stroke-width="1.5" opacity="0.5"/>
    <!-- Center node -->
    <circle cx="22" cy="24" r="6" fill="#00B4FF"/>
    <!-- Corner nodes -->
    <circle cx="22" cy="0" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
    <circle cx="44" cy="12" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
    <circle cx="44" cy="36" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
    <circle cx="22" cy="48" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
    <circle cx="0" cy="36" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="3.5" fill="#0B1D3A" stroke="#00B4FF" stroke-width="1.5"/>
  </g>
  <!-- Text -->
  <text x="65" y="28" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="22" fill="#0B1D3A" letter-spacing="0.5">DUTA</text>
  <text x="133" y="28" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="22" fill="#00B4FF" letter-spacing="0.5">INTEGRA</text>
  <text x="65" y="48" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#7A8FAD" letter-spacing="3">SOLUTIONS</text>
</svg>