<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Integra - Merdeka Theme Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #0F1822; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: 'Inter', sans-serif; position: relative; }
    canvas { display: block; }
    .brand { position: fixed; top: 20px; color: #C9A227; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; z-index: 10; }
    .nav { position: fixed; bottom: 20px; display: flex; gap: 20px; z-index: 10; }
    .nav a { color: #B8BEC8; text-decoration: none; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav a:hover { color: #CC0001; }
    .flag-badge { position: fixed; top: 80px; width: 30px; height: 20px; background: repeating-linear-gradient(to bottom, #CC0001 0 5px, #FFFFFF 5px 10px); box-shadow: 0 0 0 0.5px rgba(255,255,255,.2); z-index: 5; }
  </style>
</head>
<body>
  <div class="brand">Duta Integra Solutions</div>
  <div class="nav"><a href="#services">Services</a><a href="#about">About</a><a href="#cases">Projects</a><a href="#contact">Contact</a></div>
  <div class="flag-badge"></div>
  <canvas id="bg-canvas"></canvas>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    let t = 0;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    const NP = 50;
    const BD = 200;
    const particles = [];
    for (let i = 0; i < NP; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 300 + Math.random() * 200;
      particles.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta),
        z: r * Math.cos(phi),
        vx: (Math.random() - 0.5) * 0.015,
        vy: (Math.random() - 0.5) * 0.015,
        vz: (Math.random() - 0.5) * 0.015
      });
    }

    const proj = (x, y, z) => {
      const f = 600 / (600 + z);
      return { x: w / 2 + x * f, y: h / 2 + y * f };
    };

    const merdekaColors = [
      { r: 201, g: 162, b: 39 }, // Gold
      { r: 255, g: 0, b: 0 },    // Red
      { r: 255, g: 255, b: 255 } // White
    ];

    const render = () => {
      t += 0.016;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0F1822';
      ctx.fillRect(0, 0, w, h);

      // Cycle through merdeka colors
      const colorIdx = Math.floor((t * 0.2) % merdekaColors.length);
      const c = merdekaColors[colorIdx];
      
      // Draw connections
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        const p1p = proj(p1.x, p1.y, p1.z);
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < BD) {
            const p2p = proj(p2.x, p2.y, p2.z);
            ctx.beginPath();
            ctx.moveTo(p1p.x, p1p.y);
            ctx.lineTo(p2p.x, p2p.y);
            ctx.stroke();
          }
        }
      }

      // Update positions
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.z += p.vz;
        if (Math.abs(p.x) > 450) p.vx *= -0.4;
        if (Math.abs(p.y) > 450) p.vy *= -0.4;
        if (Math.abs(p.z) > 450) p.vz *= -0.4;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(render);
    };

    render();
  </script>
</body>
</html>
