<!-- Duta Integra - Contact Form with Turnstile - FINAL INTEGRATED -->
<!-- Sitekey: 0x4AAAAAAEWiPSuuWyfT-IU5 | Action: contact | Domains: localhost, 127.0.0.1, dutaintegra.my, www.dutaintegra.my -->

<section id="contact" class="contact-section">
  <form id="contactForm" method="POST" novalidate>
    <!-- Honeypot - bots fill this -->
    <input type="text" name="website" id="website" autocomplete="off" tabindex="-1" 
           style="position:absolute; left:-9999px; opacity:0; height:0; width:0;" aria-hidden="true">

    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" name="name" required minlength="2" maxlength="100" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required placeholder="john@company.com">
    </div>

    <div class="form-group">
      <label for="company">Company</label>
      <input type="text" id="company" name="company" maxlength="200" placeholder="Acme Inc">
    </div>

    <div class="form-group">
      <label for="message">How can we help? *</label>
      <textarea id="message" name="message" required minlength="10" maxlength="5000" rows="5" 
                placeholder="Tell us about your project..."></textarea>
    </div>

    <!-- Cloudflare Turnstile Widget -->
    <div class="cf-turnstile" 
         data-sitekey="0x4AAAAAAEWiPSuuWyfT-IU5" 
         data-action="contact"
         data-theme="light"
         data-callback="onTurnstileSuccess"
         data-error-callback="onTurnstileError"
         data-expired-callback="onTurnstileExpired"></div>

    <button type="submit" id="submitBtn">Send Message</button>
    <p id="formStatus" aria-live="polite" role="status"></p>
  </form>
</section>

<!-- Turnstile API - load once per page -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
// Turnstile lifecycle - token is single-use, must reset after submit
let turnstileWidgetId = null;
let turnstileToken = null;

function onTurnstileSuccess(token) {
  turnstileToken = token;
  // Store widget ID if available
  const el = document.querySelector('.cf-turnstile');
  if (el) {
    // Turnstile will auto-inject hidden input, but we keep token for explicit control
    document.getElementById('formStatus').textContent = '';
  }
}

function onTurnstileError() {
  turnstileToken = null;
  document.getElementById('formStatus').textContent = 'Security check failed. Please refresh.';
}

function onTurnstileExpired() {
  turnstileToken = null;
  document.getElementById('formStatus').textContent = 'Security check expired. Please verify again.';
  // Reset widget to get new token
  if (window.turnstile && turnstileWidgetId !== null) {
    window.turnstile.reset(turnstileWidgetId);
  } else if (window.turnstile) {
    window.turnstile.reset();
  }
}

// Capture widget ID when rendered
window.addEventListener('load', () => {
  // Wait for turnstile to be ready
  const check = setInterval(() => {
    if (window.turnstile) {
      const widgets = document.querySelectorAll('.cf-turnstile');
      // turnstile.getResponse and render return IDs, but implicit render auto-assigns
      // We can use turnstile.render explicitly for better control, or just rely on auto
      clearInterval(check);
    }
  }, 100);
});

document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('formStatus');
  const form = e.target;

  // Get fresh token from Turnstile
  const tokenInput = form.querySelector('[name="cf-turnstile-response"]');
  const token = tokenInput ? tokenInput.value : turnstileToken;

  if (!token) {
    status.textContent = 'Please complete the security check.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';
  status.textContent = '';

  const formData = new FormData(form);
  
  const data = {
    name: formData.get('name'),
    email: formData.get('email'),
    company: formData.get('company'),
    message: formData.get('message'),
    website: formData.get('website'),
    'cf-turnstile-response': token
  };

  try {
    const res = await fetch('/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
    const json = await res.json();
    
    if (!res.ok) throw new Error(json.error || 'Failed to send');

    status.textContent = '✓ Message sent! We will reply within 24h.';
    status.style.color = 'green';
    form.reset();
    
    // Reset Turnstile - token is single-use, must reset after success
    if (window.turnstile) {
      try {
        window.turnstile.reset();
      } catch {}
    }
    turnstileToken = null;

  } catch (err) {
    status.textContent = err.message || 'Failed to send. Please try again.';
    status.style.color = 'red';
    
    // Reset Turnstile on failure too - allow retry with fresh token
    if (window.turnstile) {
      try {
        window.turnstile.reset();
      } catch {}
    }
    turnstileToken = null;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Message';
  }
});
</script>

<style>
.contact-section { max-width: 600px; margin: 0 auto; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
.form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; }
.cf-turnstile { margin: 1rem 0; }
#submitBtn { background: #0f172a; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; }
#submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }
#formStatus { margin-top: 0.75rem; min-height: 1.5rem; }
</style>
