<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Integra - Circuit Board Background (LIVE)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      min-height: 100vh; 
      background: #0F1822; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    canvas { 
      display: block; 
      background: #0F1822; 
    }
    .brand {
      position: fixed;
      top: 20px;
      color: #C9A227;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 10;
    }
    .nav {
      position: fixed;
      bottom: 20px;
      display: flex;
      gap: 20px;
      z-index: 10;
    }
    .nav a {
      color: #B8BEC8;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav a:hover { color: #C9A227; }
    .description {
      position: fixed;
      top: 80px;
      color: #8B8D93;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="brand">Duta Integra Solutions</div>
  <div class="nav"><a href="#services">Services</a><a href="#about">About</a><a href="#cases">Projects</a><a href="#contact">Contact</a></div>
  <div class="description">Circuit Board Background — 40 particles, gold connections, slow orbit</div>
  <canvas id="network-bg"></canvas>

  <script>
    // CIRCUIT BOARD BACKGROUND - SAME AS APPLIED TO SITE
    const canvas = document.getElementById('network-bg');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const NP = 40;
    const BED = 150;
    let t = 0;
    const particles = [];
    for (let i = 0; i < NP; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 350 + Math.random() * 100;
      particles.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta),
        z: r * Math.cos(phi),
        vx: (Math.random() - 0.5) * 0.008,
        vy: (Math.random() - 0.5) * 0.008,
        vz: (Math.random() - 0.5) * 0.008
      });
    }

    const proj = (x, y, z) => {
      const f = 700 / (700 + z);
      return { x: w / 2 + x * f, y: h / 2 + y * f };
    };

    const render = () => {
      t += 0.016;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0F1822';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(201,162,39,0.4)';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        const p1p = proj(p1.x, p1.y, p1.z);
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < BED) {
            const p2p = proj(p2.x, p2.y, p2.z);
            ctx.beginPath();
            ctx.moveTo(p1p.x, p1p.y);
            ctx.lineTo(p2p.x, p2p.y);
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        if (Math.abs(p.x) > 400) p.vx *= -0.3;
        if (Math.abs(p.y) > 400) p.vy *= -0.3;
        if (Math.abs(p.z) > 400) p.vz *= -0.3;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(render);
    };

    render();
  </script>
</body>
</html>
